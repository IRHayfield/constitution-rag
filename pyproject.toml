[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constitution-rag"
version = "0.1.0"
description = "RAG system for constitutional documents with Ollama integration"
authors = [
    {name = "User", email = "user@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.14.9"
dependencies = [
    "langchain>=0.1.0",
    "langchain-community>=0.1.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0",
    "pymupdf>=1.19.0",
    "chromadb>=0.4.0",
    "ollama>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[project.scripts]
constitution-rag = "demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
python_files = ["tests/*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose"
testpaths = ["tests"]